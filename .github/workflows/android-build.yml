name: Build local ED APK
on:
  workflow_dispatch:
  push:
    branches: [main, ed-local-openclaw]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npx vite build
      - run: npx cap add android && npx cap sync android
      - name: Permit phone loopback API and microphone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          i=s.index('>')+1
          for perm in ('INTERNET','RECORD_AUDIO'):
              entry=f'<uses-permission android:name="android.permission.{perm}" />'
              if entry not in s: s=s[:i]+'\n'+entry+s[i:]
          if 'android:usesCleartextTraffic' not in s:
              s=s.replace('<application ','<application android:usesCleartextTraffic="true" ',1)
          p.write_text(s)
          PY
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ED-local-openclaw-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
