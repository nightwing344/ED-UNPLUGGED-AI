name: Build ED Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ed-v1.1-memory
    paths:
      - 'Interface/Web/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Interface/Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Interface/Web/package-lock.json

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build ED web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload ED APK
        uses: actions/upload-artifact@v4
        with:
          name: ed-unplugged-v1.1-debug-apk
          path: Interface/Web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
