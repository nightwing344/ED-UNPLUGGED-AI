name: Build local ED APK
on:
  workflow_dispatch:
  push:
    branches: [main, ed-local-openclaw]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npx vite build
      - run: npx cap add android && npx cap sync android
      - name: Permit phone loopback API and microphone
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')

          # Capacitor already supplies a normal Android manifest. Modify only
          # the application attribute and explicit permissions we need.
          if 'android:usesCleartextTraffic=' not in s:
              if '<application' not in s:
                  raise SystemExit('AndroidManifest.xml has no <application> element')
              s = s.replace(
                  '<application',
                  '<application\n        android:usesCleartextTraffic="true"',
                  1,
              )

          permissions = [
              'android.permission.INTERNET',
              'android.permission.RECORD_AUDIO',
          ]

          missing = [
              perm for perm in permissions
              if f'android:name="{perm}"' not in s
          ]

          if missing:
              if '</manifest>' not in s:
                  raise SystemExit('AndroidManifest.xml has no closing </manifest>')
              additions = ''.join(
                  f'    <uses-permission android:name="{perm}" />\n'
                  for perm in missing
              )
              s = s.replace('</manifest>', additions + '</manifest>', 1)

          p.write_text(s, encoding='utf-8')

          # Fail here with a useful XML parse error instead of later in Gradle.
          ET.parse(p)
          print('AndroidManifest.xml XML validation: PASS')
          print(p.read_text(encoding='utf-8'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ED-local-openclaw-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
